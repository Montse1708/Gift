<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday</title>
  <link rel="icon" href="cake.gif" type="image/x-icon">
  <link rel="stylesheet" href="photos.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <h1>💕 26 años 💕</h1>
  <div class="circle-gallery">
    <div class="circle-card">
      <div class="circle-inner">
        <div class="circle-front">
          <img src="1.jpg" alt="Foto 1">
        </div>
        <div class="circle-back">
          <p>Como ha pasado el tiempo 💖</p>
        </div>
      </div>
    </div>

    <div class="circle-card">
      <div class="circle-inner">
        <div class="circle-front">
          <img src="2.jpeg" alt="Foto 2">
        </div>
        <div class="circle-back">
          <p>Muchas felicidades mi amor 🌟</p>
        </div>
      </div>
    </div>

    <div class="circle-card">
        <div class="circle-inner">
          <div class="circle-front">
            <img src="3.jpeg" alt="Foto 2">
          </div>
          <div class="circle-back">
            <p>Feliz cumpleños mi cielo🌟</p>
          </div>
        </div>
      </div>
      <div class="circle-card">
        <div class="circle-inner">
          <div class="circle-front">
            <img src="4.jpeg" alt="Foto 2">
          </div>
          <div class="circle-back">
            <p>Te deseo siempre lo mejor mi amor. 🌟</p>
          </div>
        </div>
      </div>
      <div class="circle-card">
        <div class="circle-inner">
          <div class="circle-front">
            <img src="5.jpeg" alt="Foto 2">
          </div>
          <div class="circle-back">
            <p>Hoy celebramos tu vida y la dicha que traes a todos los que te rodean. 🌟</p>
          </div>
        </div>
      </div>

      <div class="carousel-container">
        <div class="carousel-slide">
          <img src="7.jpg" class="carousel-img" alt="1">
          <img src="8.jpg" class="carousel-img" alt="2">
          <img src="9.jpg" class="carousel-img" alt="3">
          <img src="10.jpeg" class="carousel-img" alt="4">
          <img src="11.jpg" class="carousel-img" alt="5">
          <img src="12.jpg" class="carousel-img" alt="6">
          <img src="13.jpg" class="carousel-img" alt="7">
          
        </div>
        <button class="prev" onclick="changeSlide(-1)">❮</button>
        <button class="next" onclick="changeSlide(1)">❯</button>
      </div>
      <div class="next-surprise-container">
        <a href="timeline.html" class="next-surprise-btn">🎉 Siguiente sorpresa</a>
      </div>      
  </div>

  <script src="photos.js"></script>
</body>
</html>
